[project]
name = "exact_synthesis"
version = "0.1.0"
description = "Quantum synthesis toolkit for fibonacci anyons"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "mpmath>=1.3.0",
  "qiskit>=2.5.2",
  "sympy>=1.12",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.1",
  "scipy>=1.11",
]
dev = [
  "ipykernel>=6.29.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
  "exact-synthesis",
  "ipykernel>=6.29.5",
  "pytest>=8.4.1",
  "scipy>=1.11",
  "ty>=0.0.16",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
exact-synthesis = { workspace = true }
